<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Majeed Khan -- Task Board</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0b0f1a;
    --line: rgba(255, 255, 255, 0.08);
    --text: #e8edf7;
    --muted: #8a94a8;
    --accent: #4f8cff;
    --accent2: #8b5cf6;
    --ok: #22c55e;
  }

  html, body { background-color: var(--bg); }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, #1b2544 0%, transparent 55%),
      radial-gradient(circle at 85% 100%, #241b3f 0%, transparent 55%),
      #0b0f1a;
  }

  .card {
    width: 100%;
    max-width: 540px;
    padding: 36px 32px;
    background-color: #131c30;
    background-image: linear-gradient(160deg, #131c30 0%, #0d1424 100%);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.8);
  }

  /* --- screens: ALL visible by default; JS hides inactive ones --- */
  .screen { display: block; }
  .screen + .screen { margin-top: 40px; }

  html.js .screen { display: none; }
  html.js .screen.active { display: block; animation: fadeUp 0.45s cubic-bezier(0.2, 0.8, 0.2, 1); }
  html.js .screen + .screen { margin-top: 0; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* --- welcome --- */
  .welcome { text-align: center; padding: 8px 0; }

  .avatar {
    width: 84px; height: 84px;
    margin: 0 auto 22px;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 0 6px rgba(79, 140, 255, 0.12), 0 14px 34px -8px rgba(79, 140, 255, 0.7);
  }
  .avatar svg, .avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }

  .name {
    font-size: clamp(2.1rem, 8vw, 3.1rem);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: #ffffff;
  }

  .tagline { margin-top: 12px; color: var(--muted); font-size: 0.95rem; }

  /* --- tasks --- */
  .header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .title { font-size: 1.35rem; font-weight: 700; }
  .counter { font-size: 0.8rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .subtitle { color: var(--muted); font-size: 0.88rem; margin-bottom: 20px; }

  .progress { height: 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); overflow: hidden; margin-bottom: 24px; }
  .progress-fill {
    height: 100%; width: 0%; border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .task-list { list-style: none; display: grid; gap: 10px; }

  .task {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.02);
    cursor: pointer;
    user-select: none;
    transition: background 0.2s, border-color 0.2s;
  }
  .task:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.16); }

  .task input { position: absolute; opacity: 0; width: 0; height: 0; }

  .box {
    flex: 0 0 22px; width: 22px; height: 22px;
    border-radius: 7px;
    border: 2px solid #39445e;
    display: grid; place-items: center;
    transition: background 0.2s, border-color 0.2s;
  }
  .box::after {
    content: "";
    width: 10px; height: 6px;
    border-left: 2.5px solid #fff;
    border-bottom: 2.5px solid #fff;
    transform: rotate(-45deg) scale(0);
    transition: transform 0.18s cubic-bezier(0.2, 1.4, 0.4, 1);
    margin-top: -2px;
  }
  .task input:checked + .box {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-color: transparent;
  }
  .task input:checked + .box::after { transform: rotate(-45deg) scale(1); }

  .task-text { font-size: 0.94rem; }
  .task input:checked ~ .task-text {
    color: var(--muted);
    text-decoration: line-through;
    opacity: 0.75;
  }

  /* --- buttons --- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 100%;
    padding: 14px 20px;
    margin-top: 26px;
    border: none;
    border-radius: 14px;
    font: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    background: #4f8cff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 12px 28px -10px rgba(79, 140, 255, 0.85);
    transition: transform 0.15s, opacity 0.2s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:disabled { cursor: not-allowed; opacity: 0.4; box-shadow: none; }

  .btn.ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font-weight: 600;
    box-shadow: none;
  }
  .btn.ghost:hover { color: var(--text); }

  /* --- thanks --- */
  .thanks { text-align: center; padding: 8px 0; }

  .check-ring {
    width: 96px; height: 96px;
    margin: 0 auto 26px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: rgba(34, 197, 94, 0.12);
    border: 2px solid rgba(34, 197, 94, 0.45);
  }
  .check-ring svg { width: 46px; height: 46px; }
  .check-ring path {
    stroke: var(--ok); stroke-width: 5;
    stroke-linecap: round; stroke-linejoin: round;
    fill: none;
  }
  html.js .check-ring { animation: ring 0.7s cubic-bezier(0.2, 1.3, 0.4, 1); }
  @keyframes ring {
    0%   { transform: scale(0.4); opacity: 0; }
    60%  { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }
  html.js .check-ring path {
    stroke-dasharray: 48; stroke-dashoffset: 48;
    animation: draw 0.5s 0.3s ease forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .thanks h2 { font-size: 1.75rem; font-weight: 800; margin-bottom: 10px; }
  .thanks p {
    color: var(--muted); font-size: 0.95rem; line-height: 1.6;
    max-width: 38ch; margin: 0 auto;
  }
  .thanks .highlight { color: var(--text); font-weight: 600; }

  @media (max-width: 420px) {
    .card { padding: 28px 20px; }
  }
</style>
</head>
<body>

<main class="card">

  <!-- ===== WELCOME ===== -->
  <section class="screen active" id="screen-welcome">
    <div class="welcome">
      <div class="avatar">
        <!-- Inline SVG — always renders, no external file needed -->
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="ag" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4f8cff"/>
              <stop offset="1" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
          <rect width="100" height="100" fill="url(#ag)"/>
          <circle cx="50" cy="38" r="16" fill="#ffffff"/>
          <path d="M18 92c4-18 16-28 32-28s28 10 32 28z" fill="#ffffff"/>
        </svg>
      </div>
      <h1 class="name" id="welcomeName">Majeed Khan</h1>
      <p class="tagline">Youtube Account agreement Sign</p>
    </div>
    <button class="btn" id="startBtn">Get Started</button>
  </section>

  <!-- ===== TASKS (static in HTML — visible even without JS) ===== -->
  <section class="screen" id="screen-tasks">
    <div class="header">
      <h2 class="title">Sign below</h2>
      <span class="counter" id="counter">0 / 5</span>
    </div>
    <p class="subtitle">Check off each Line to, Che baya na yye .</p>

    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>

    <ul class="task-list" id="taskList">
      <li><label class="task"><input type="checkbox" data-task aria-label="Task 1"><span class="box"></span><span class="task-text">Account khabra start kam</span></label></li>
      <li><label class="task"><input type="checkbox" data-task aria-label="Task 2"><span class="box"></span><span class="task-text">3 Check For acc agreement</span></label></li>
      <li><label class="task"><input type="checkbox" data-task aria-label="Task 3"><span class="box"></span><span class="task-text">I'm agreed</span></label></li>
      <li><label class="task"><input type="checkbox" data-task aria-label="Task 4"><span class="box"></span><span class="task-text">I'm agreed</span></label></li>
      <li><label class="task"><input type="checkbox" data-task aria-label="Task 5"><span class="box"></span><span class="task-text">I'm agreed</span></label></li>
    </ul>

    <button class="btn" id="finishBtn" disabled>Complete All Tasks</button>
  </section>

  <!-- ===== THANKS ===== -->
  <section class="screen" id="screen-thanks">
    <div class="thanks">
      <div class="check-ring">
        <svg viewBox="0 0 52 52" aria-hidden="true">
          <path d="M14 27 L22 35 L38 18" />
        </svg>
      </div>
      <h2>Thank You!</h2>
      <p>
        All Sign completed. Thanks for Agreements,
        <span class="highlight" id="thanksName">Majeed Khan</span>.
        Have a great day!
      </p>
    </div>
    <button class="btn ghost" id="restartBtn">Start Over</button>
  </section>

</main>

<script>
  document.documentElement.classList.add("js");

  const NAME = "Majeed Khan";
  document.getElementById("welcomeName").textContent = NAME;
  document.getElementById("thanksName").textContent = NAME;
  document.title = NAME + " -- Task Board";

  const screens   = document.querySelectorAll(".screen");
  const boxes     = document.querySelectorAll("[data-task]");
  const counter   = document.getElementById("counter");
  const progress  = document.getElementById("progressFill");
  const finishBtn = document.getElementById("finishBtn");

  function showScreen(id) {
    screens.forEach(s => s.classList.toggle("active", s.id === id));
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function updateProgress() {
    const total = boxes.length;
    let done = 0;
    boxes.forEach(b => { if (b.checked) done++; });
    progress.style.width = (done / total * 100) + "%";
    counter.textContent = done + " / " + total;
    finishBtn.disabled = done !== total;
  }

  boxes.forEach(b => b.addEventListener("change", updateProgress));

  document.getElementById("startBtn").addEventListener("click", () => showScreen("screen-tasks"));
  finishBtn.addEventListener("click", () => showScreen("screen-thanks"));
  document.getElementById("restartBtn").addEventListener("click", () => {
    boxes.forEach(b => { b.checked = false; });
    updateProgress();
    showScreen("screen-welcome");
  });

  updateProgress();
</script>

</body>
</html>
