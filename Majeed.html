<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Majeed Khan -- Task Board</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0b0f1a;
    --card: #101828;
    --line: rgba(255, 255, 255, 0.08);
    --text: #e8edf7;
    --muted: #8a94a8;
    --accent: #4f8cff;
    --accent2: #8b5cf6;
    --ok: #22c55e;
  }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, #1b2544 0%, transparent 55%),
      radial-gradient(circle at 85% 100%, #241b3f 0%, transparent 55%),
      var(--bg);
  }

  .card {
    width: 100%;
    max-width: 540px;
    padding: 36px 32px;
    background: linear-gradient(160deg, #131c30 0%, #0d1424 100%);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.8);
  }

  /* ---------- screens ---------- */
  .screen { display: none; }
  .screen.active { display: block; animation: fadeUp 0.45s cubic-bezier(0.2, 0.8, 0.2, 1); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- welcome ---------- */
  .welcome { text-align: center; padding: 16px 0 8px; }

  .avatar {
    width: 84px; height: 84px;
    margin: 0 auto 22px;
    display: grid; place-items: center;
    font-size: 2rem; font-weight: 800; letter-spacing: 1px;
    color: #fff;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 0 0 6px rgba(79, 140, 255, 0.12), 0 14px 34px -8px rgba(79, 140, 255, 0.7);
    animation: pop 0.6s cubic-bezier(0.2, 1.4, 0.4, 1);
  }

  @keyframes pop {
    from { transform: scale(0.6); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .name {
    font-size: clamp(2.1rem, 8vw, 3.1rem);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.02em;
    background: linear-gradient(100deg, #ffffff 10%, #9db8ff 55%, #c4a8ff 95%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline {
    margin-top: 12px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  /* ---------- tasks ---------- */
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }

  .title { font-size: 1.35rem; font-weight: 700; }

  .counter {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.88rem;
    margin-bottom: 20px;
  }

  .progress {
    height: 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    overflow: hidden;
    margin-bottom: 24px;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .task-list { list-style: none; display: grid; gap: 10px; }

  .task {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.02);
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
    user-select: none;
  }

  .task:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.16); }
  .task:active { transform: scale(0.99); }

  .task input { position: absolute; opacity: 0; width: 0; height: 0; }

  .box {
    flex: 0 0 22px;
    width: 22px; height: 22px;
    border-radius: 7px;
    border: 2px solid #39445e;
    display: grid; place-items: center;
    transition: background 0.2s, border-color 0.2s;
  }

  .box::after {
    content: "";
    width: 10px; height: 6px;
    border-left: 2.5px solid #fff;
    border-bottom: 2.5px solid #fff;
    transform: rotate(-45deg) scale(0);
    transition: transform 0.18s cubic-bezier(0.2, 1.4, 0.4, 1);
    margin-top: -2px;
  }

  .task input:checked + .box {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-color: transparent;
  }

  .task input:checked + .box::after { transform: rotate(-45deg) scale(1); }

  .task input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }

  .task-text { font-size: 0.94rem; transition: color 0.2s, opacity 0.2s; }

  .task input:checked ~ .task-text {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: rgba(138, 148, 168, 0.6);
    opacity: 0.75;
  }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px 20px;
    margin-top: 26px;
    border: none;
    border-radius: 14px;
    font: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 12px 28px -10px rgba(79, 140, 255, 0.85);
    transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
  }

  .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 16px 34px -10px rgba(79, 140, 255, 0.95); }
  .btn:active:not(:disabled) { transform: translateY(0) scale(0.99); }

  .btn:disabled {
    cursor: not-allowed;
    opacity: 0.4;
    box-shadow: none;
  }

  .btn.ghost {
    background: transparent;
    border: 1px solid var(--line);
    box-shadow: none;
    color: var(--muted);
    font-weight: 600;
  }

  .btn.ghost:hover { color: var(--text); border-color: rgba(255, 255, 255, 0.24); }

  /* ---------- thanks ---------- */
  .thanks { text-align: center; padding: 12px 0 4px; }

  .check-ring {
    width: 96px; height: 96px;
    margin: 0 auto 26px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: rgba(34, 197, 94, 0.12);
    border: 2px solid rgba(34, 197, 94, 0.45);
    animation: ring 0.7s cubic-bezier(0.2, 1.3, 0.4, 1);
  }

  @keyframes ring {
    0%   { transform: scale(0.4); opacity: 0; }
    60%  { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }

  .check-ring svg { width: 46px; height: 46px; }

  .check-ring path {
    stroke: var(--ok);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke-dasharray: 48;
    stroke-dashoffset: 48;
    animation: draw 0.5s 0.3s ease forwards;
  }

  @keyframes draw { to { stroke-dashoffset: 0; } }

  .thanks h2 {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
  }

  .thanks p {
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.6;
    max-width: 38ch;
    margin: 0 auto;
  }

  .thanks .highlight { color: var(--text); font-weight: 600; }

  @media (max-width: 420px) {
    .card { padding: 28px 20px; }
  }
</style>
</head>
<body>

<main class="card">

  <!-- ===== SCREEN 1: WELCOME ===== -->
  <section class="screen active" id="screen-welcome">
    <div class="welcome">
      <div class="avatar" id="avatar">MK</div>
      <h1 class="name" id="welcomeName">Majeed Khan</h1>
      <p class="tagline">Youtube Account agreement Sign</p>
    </div>
    <button class="btn" id="startBtn">Get Started</button>
  </section>

  <!-- ===== SCREEN 2: TASKS ===== -->
  <section class="screen" id="screen-tasks">
    <div class="header">
      <h2 class="title">Sign below</h2>
      <span class="counter" id="counter">0 / 0</span>
    </div>
    <p class="subtitle">Check off each Line to, Che baya na yye .</p>

    <div class="progress">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <button class="btn" id="finishBtn" disabled>Complete All Tasks</button>
  </section>

  <!-- ===== SCREEN 3: THANKS ===== -->
  <section class="screen" id="screen-thanks">
    <div class="thanks">
      <div class="check-ring">
        <svg viewBox="0 0 52 52" aria-hidden="true">
          <path d="M14 27 L22 35 L38 18" />
        </svg>
      </div>
      <h2>Thank You!</h2>
      <p>
        All Sign completed. Thanks for Agreements,
        <span class="highlight" id="thanksName">Majeed Khan</span>.
        Have a great day!
      </p>
    </div>
    <button class="btn ghost" id="restartBtn">Start Over</button>
  </section>

</main>

<script>
  /* ------------------------------------------------------------------ */
  /*  Config                                                             */
  /* ------------------------------------------------------------------ */
  const NAME = "Majeed Khan";

  const TASKS = [
    "Account khabra start kam",
    "3 Check For acc agreement",
    "I'm agreed",
    "I'm agreed",
    "I'm agreed"
  ];

  /* ------------------------------------------------------------------ */
  /*  Element refs                                                       */
  /* ------------------------------------------------------------------ */
  const screens     = document.querySelectorAll(".screen");
  const welcomeName = document.getElementById("welcomeName");
  const avatar      = document.getElementById("avatar");
  const thanksName  = document.getElementById("thanksName");
  const taskList    = document.getElementById("taskList");
  const counter     = document.getElementById("counter");
  const progress    = document.getElementById("progressFill");
  const finishBtn   = document.getElementById("finishBtn");

  /* ------------------------------------------------------------------ */
  /*  Helpers                                                            */
  /* ------------------------------------------------------------------ */
  function showScreen(id) {
    screens.forEach((s) => s.classList.toggle("active", s.id === id));
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function initials(fullName) {
    return fullName
      .trim()
      .split(/\s+/)
      .map((w) => w[0])
      .join("")
      .slice(0, 2)
      .toUpperCase();
  }

  /* ------------------------------------------------------------------ */
  /*  Build the task list                                                */
  /* ------------------------------------------------------------------ */
  function renderTasks() {
    taskList.innerHTML = "";

    TASKS.forEach((text, i) => {
      const li = document.createElement("li");

      const label = document.createElement("label");
      label.className = "task";

      const input = document.createElement("input");
      input.type = "checkbox";
      input.id = `task-${i}`;
      input.setAttribute("aria-label", text);

      const box = document.createElement("span");
      box.className = "box";

      const span = document.createElement("span");
      span.className = "task-text";
      span.textContent = text;

      label.append(input, box, span);
      li.appendChild(label);
      taskList.appendChild(li);

      input.addEventListener("change", updateProgress);
    });

    updateProgress();
  }

  /* ------------------------------------------------------------------ */
  /*  Progress + finish-button state                                     */
  /* ------------------------------------------------------------------ */
  function updateProgress() {
    const boxes = taskList.querySelectorAll('input[type="checkbox"]');
    const total = boxes.length;
    let done = 0;

    boxes.forEach((b) => { if (b.checked) done++; });

    const pct = total ? (done / total) * 100 : 0;
    progress.style.width = pct + "%";
    counter.textContent = `${done} / ${total}`;
    finishBtn.disabled = done !== total;
  }

  /* ------------------------------------------------------------------ */
  /*  Wire up the flow                                                   */
  /* ------------------------------------------------------------------ */
  function init() {
    welcomeName.textContent = NAME;
    avatar.textContent = initials(NAME);
    thanksName.textContent = NAME;
    document.title = `${NAME} -- Task Board`;

    renderTasks();
  }

  document.getElementById("startBtn").addEventListener("click", () => {
    showScreen("screen-tasks");
  });

  finishBtn.addEventListener("click", () => {
    showScreen("screen-thanks");
  });

  document.getElementById("restartBtn").addEventListener("click", () => {
    taskList.querySelectorAll('input[type="checkbox"]').forEach((b) => {
      b.checked = false;
    });
    updateProgress();
    showScreen("screen-welcome");
  });

  init();
</script>

</body>
</html>
